<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="s1">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.4"/>
    </filter>
    <filter id="s2">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <!-- Top highlight -->
  <rect x="32" y="32" width="960" height="400" rx="216" fill="#fff" opacity="0.08"/>

  <!-- Main chat bubble -->
  <path d="M220 260 C220 220 250 190 290 190 L730 190 C770 190 800 220 800 260 L800 530 C800 570 770 600 730 600 L460 600 L360 700 L380 600 L290 600 C250 600 220 570 220 530 Z"
        fill="url(#bubble)" filter="url(#s1)"/>

  <!-- Text line placeholders -->
  <g opacity="0.15">
    <rect x="290" y="240" width="280" height="16" rx="8" fill="#1E40AF"/>
    <rect x="290" y="275" width="200" height="16" rx="8" fill="#1E40AF"/>
    <rect x="290" y="320" width="400" height="16" rx="8" fill="#1E40AF"/>
    <rect x="290" y="355" width="350" height="16" rx="8" fill="#1E40AF"/>
    <rect x="290" y="400" width="260" height="16" rx="8" fill="#1E40AF"/>
    <rect x="290" y="435" width="320" height="16" rx="8" fill="#1E40AF"/>
    <rect x="290" y="480" width="180" height="16" rx="8" fill="#1E40AF"/>
    <rect x="290" y="515" width="370" height="16" rx="8" fill="#1E40AF"/>
  </g>

  <!-- Rising chart line -->
  <polyline points="320,540 420,490 520,510 600,450 680,470 740,390"
    fill="none" stroke="#2563EB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
  <circle cx="600" cy="450" r="9" fill="#2563EB" opacity="0.3"/>
  <circle cx="740" cy="390" r="9" fill="#2563EB" opacity="0.3"/>

  <!-- Lens ring -->
  <g transform="translate(640, 580)" filter="url(#s2)">
    <circle cx="0" cy="0" r="130" fill="#3B82F6" opacity="0.9"/>
    <circle cx="0" cy="0" r="90" fill="#2563EB"/>
    <circle cx="0" cy="0" r="88" fill="#1D4ED8" opacity="0.5"/>
    <line x1="92" y1="92" x2="190" y2="190" stroke="#2563EB" stroke-width="44" stroke-linecap="round" opacity="0.9"/>
    <line x1="92" y1="92" x2="190" y2="190" stroke="#1D4ED8" stroke-width="28" stroke-linecap="round"/>
    <!-- Shine -->
    <path d="M-55 -65 Q-10 -90 25 -55" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
    <path d="M-70 -30 Q-55 -50 -30 -45" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
